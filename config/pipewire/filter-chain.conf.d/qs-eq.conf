# 10-band equalizer for the Quickshell media panel.
# A WirePlumber "smart filter": it sits in front of whatever the default output is,
# so switching outputs (audio-switch.sh) keeps the EQ. Gains are set live by the shell
# with pw-cli; they all start flat. Delete this file and restart filter-chain to remove.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Equalizer"
            media.name       = "Equalizer"
            filter.graph = {
                nodes = [
                    { type = builtin name = eq_band_1 label = bq_lowshelf control = { "Freq" = 31.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_2 label = bq_peaking control = { "Freq" = 63.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_3 label = bq_peaking control = { "Freq" = 125.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_4 label = bq_peaking control = { "Freq" = 250.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_5 label = bq_peaking control = { "Freq" = 500.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_6 label = bq_peaking control = { "Freq" = 1000.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_7 label = bq_peaking control = { "Freq" = 2000.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_8 label = bq_peaking control = { "Freq" = 4000.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_9 label = bq_peaking control = { "Freq" = 8000.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_10 label = bq_highshelf control = { "Freq" = 16000.0 "Q" = 1.0 "Gain" = 0.0 } }
                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                    { output = "eq_band_6:Out" input = "eq_band_7:In" }
                    { output = "eq_band_7:Out" input = "eq_band_8:In" }
                    { output = "eq_band_8:Out" input = "eq_band_9:In" }
                    { output = "eq_band_9:Out" input = "eq_band_10:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.qs_eq"
                media.class = Audio/Sink
                filter.smart = true
                filter.smart.name = "qs-eq"
            }
            playback.props = {
                node.name    = "effect_output.qs_eq"
                node.passive = true
                filter.smart = true
                filter.smart.name = "qs-eq"
            }
        }
    }
]
