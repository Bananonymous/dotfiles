general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on && hyprctl hyprsunset gamma 100
    ignore_dbus_inhibit = false
}

# Dim the screen after 18 min: warning that the lock is 2 min away.
# Goes through hyprsunset (hardware gamma LUT). A decoration:screen_shader was
# tried first and made all three outputs flicker on this Intel+NVIDIA setup.
listener {
    timeout = 1080
    on-timeout = hyprctl hyprsunset gamma 30
    on-resume = hyprctl hyprsunset gamma 100
}

# Lock after 20 min
listener {
    timeout = 1200
    on-timeout = loginctl lock-session
}

# Screen off after 22 min
listener {
    timeout = 1320
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 30 min
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
