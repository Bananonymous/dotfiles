# Colors generated by matugen
source = ~/.config/hypr/hyprlock-colors.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    color = $surface
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = $outline
    inner_color = $container
    font_color = $text
    fade_on_empty = true
    placeholder_text = <span foreground="##$placeholderHex"> Password</span>
    fail_color = $error
    fail_text = <span foreground="##$errorHex"> $FAIL</span>
    check_color = $primary
    capslock_color = $warn
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $text
    font_size = 72
    font_family = Hack Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = $subtext
    font_size = 18
    font_family = Hack Nerd Font
    position = 0, 120
    halign = center
    valign = center
}
